# Article abstract
abstract: "Multiplex polymerase chain reaction (multiplex PCR) is a foundational enrichment technology for targeted next-generation sequencing (NGS), clinical pathogen panels, and forensic identification. However, high-plex reactions suffer from non-specific primer-dimer formation, which can monopolize sequencing throughput and deplete on-target amplification. In 2022, Xie et al. introduced SADDLE (Simulated Annealing Design using Dimer Likelihood Estimation, Nature Communications, 13, 1881; PMID: 35410464), describing an empirical heuristic scoring framework and simulated annealing algorithm to design multiplex primer pools up to 384-plex. While the experimental utility of SADDLE was demonstrated in the original paper, the validation sequencing analysis relied on proprietary MATLAB scripts coupled to external command-line aligners, while the simulated annealing design code remained proprietary under patent restrictions. In this work, following the ReScience C guidelines for computational replication, we conduct an independent replication of the central empirical NGS validation finding of Xie et al.: the read classification breakdown and primer-interaction distribution of the SADDLE-designed 384-plex validation panel across 3,942,385 raw paired-end sequencing reads (Sample E19; Figure 3f). Using an independent, open-source Python reimplementation incorporating both primer-pairing classification and genuine gapped semi-global sequence alignment (edlib) against all 384 reference amplicons, our pipeline classifies 2,860,664 reads into 43.61% to 43.86% on-target amplicons, 55.27% to 55.52% nonspecific products, and 0.87% primer-dimers, reproducing the published proportions (~43%, ~56%, ~1%) within a 1.0% absolute tolerance. We demonstrate that ungapped positional string matching artificially depresses on-target reads to 39.49% due to sequencing indels, whereas genuine gapped sequence alignment closely replicates the published results. We further corroborate the severe heavy-tailed concentration of primer-dimer formation across the 295,296 candidate primer pairings, where only 1,172 pairs (0.397%) exhibit non-zero dimerization and a single interaction (rp213 x rp371) accounts for 67.57% of all dimer reads. In a supplementary exploratory benchmark, we evaluate the predictive validity of the SADDLE Badness heuristic against nearest-neighbor thermodynamics and supervised machine learning models, documenting an Average Precision of 0.0597 while analyzing the severe probability miscalibration of supervised baselines (Brier scores ~0.20 vs ~0.0040 baseline). All replication code, derived datasets, and an automated verification script that executes in under two seconds are openly accessible under permissive licenses."

